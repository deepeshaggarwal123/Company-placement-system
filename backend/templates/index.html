<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Placement Portal Application</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

</head>

<body>

    <!-- Vue Application Mount Point -->
    <div id="app"></div>

    <!-- Vite Development -->
    {% if config.DEBUG %}
        <script type="module"
                src="http://localhost:5173/src/main.js">
        </script>
    {% else %}

    <!-- Production Build -->
        <script
            type="module"
            src="{{ url_for('static',
            filename='assets/index.js') }}">
        </script>

        <link
            rel="stylesheet"
            href="{{ url_for('static',
            filename='assets/index.css') }}">
    {% endif %}

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
